name: Pages

# Pages hosting is deferred: the site/ directory is published manually with
# "Run workflow" once Pages is enabled in the repository settings
# (Settings -> Pages -> Source: GitHub Actions). Publishing on every push
# would fail until that setting exists.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch demo video (optional)
        run: |
          mkdir -p site/assets
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/willowvibe/pipelineprobe/releases/download/v0.3.0/pipelineprobe-demo.mp4 \
            -o site/assets/pipelineprobe-demo.mp4 \
            || {
              rm -f site/assets/pipelineprobe-demo.mp4
              echo "::notice::pipelineprobe-demo.mp4 is not published yet; deploying the page with its poster and release fallback."
            }

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
